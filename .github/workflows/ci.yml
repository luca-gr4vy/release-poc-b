name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Runs on main go one at a time, start to finish, so each release sees the
# previous release's tag. Other runs get a unique group and never queue.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'release' || format('ci-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm audit --prod

  # While intents are pending, opens or updates the release PR on
  # changeset-release/main. Installs nothing: `pnpm version -r` only rewrites
  # manifests and changelogs.
  release-pr:
    needs: [ci, scan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The action builds from this run's commit. A queued older run would
      # rebuild a stale release PR, or re-create one that was just merged.
      - id: head
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          if [ "$main" = "$GITHUB_SHA" ]; then
            echo current=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $main, not $GITHUB_SHA; leaving the release PR alone"
            echo current=false >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.head.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.head.outputs.current == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.head.outputs.current == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: steps.head.outputs.current == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version -r
          pr-title: 'chore: release'
          commit-message: 'chore: release'

  # Decide and pack. No secrets: this job installs and builds.
  release-pack:
    needs: [ci, scan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: decide
        run: node scripts/release/decide.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.decide.outputs.release == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.decide.outputs.release == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.decide.outputs.release == 'true'
        run: node scripts/release/pack.mjs
      - if: steps.decide.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  # Claim tag, stage, create the Release, comment. Installs nothing. The
  # `release` environment only allows main, and npm's trusted publisher requires it.
  release-stage:
    needs: release-pack
    if: needs.release-pack.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist/
      - run: node scripts/release/stage.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          npm_config_provenance: 'false'
